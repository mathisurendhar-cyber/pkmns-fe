<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Services Management Console</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --neon-cyan: #06b6d4;
      --neon-purple: #a855f7;
      --bg-deep: #050711;
      --panel-bg: rgba(15, 21, 37, 0.85);
      --panel-border: rgba(255, 255, 255, 0.08);
    }
    * { box-sizing: border-box; }
    body {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      background-color: var(--bg-deep);
      color: #f8fafc;
      margin: 0; padding: 32px 40px;
      min-height: 100vh;
    }
    .workspace-inner { max-width: 1400px; margin: 0 auto; }
    .header-console { display: flex; justify-content: space-between; align-items: center; margin-bottom: 28px; flex-wrap: wrap; gap: 20px; }
    .header-left-title h1 {
      font-size: 30px; font-weight: 800; margin: 0 0 6px 0;
      background: linear-gradient(135deg, #ffffff 0%, #38bdf8 50%, #c084fc 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .btn-nav-back {
      display: inline-flex; align-items: center; gap: 10px;
      background: rgba(30, 41, 59, 0.8); border: 1px solid rgba(255, 255, 255, 0.12);
      color: #f1f5f9; padding: 10px 20px; border-radius: 14px; font-size: 13px; font-weight: 700; text-decoration: none;
    }
    .tabs-control-bar {
      display: flex; gap: 12px; background: rgba(15, 21, 37, 0.9); border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 6px; border-radius: 16px; margin-bottom: 32px; backdrop-filter: blur(16px);
    }
    .tab-btn {
      flex: 1; display: flex; align-items: center; justify-content: center; gap: 10px;
      padding: 14px 20px; background: transparent; border: none; color: #94a3b8; font-size: 14px; font-weight: 700; border-radius: 12px; cursor: pointer;
    }
    .tab-btn.active { color: #ffffff; background: linear-gradient(135deg, #06b6d4 0%, #8b5cf6 100%); box-shadow: 0 4px 20px rgba(6, 182, 212, 0.35); }
    .console-panel { background: var(--panel-bg); border: 1px solid var(--panel-border); border-radius: 24px; padding: 32px; backdrop-filter: blur(20px); }
    .panel-header-toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 16px; }
    .panel-title-text { font-size: 20px; font-weight: 800; color: #f8fafc; display: flex; align-items: center; gap: 12px; }
    .badge-count { background: rgba(6, 182, 212, 0.2); color: #38bdf8; border: 1px solid rgba(6, 182, 212, 0.3); padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 800; }
    .inline-form-panel { background: rgba(11, 15, 27, 0.9); border: 1px solid rgba(255, 255, 255, 0.1); padding: 20px; border-radius: 18px; margin-bottom: 28px; }
    .form-grid-row { display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
    .form-field-flex { flex: 1; min-width: 200px; }
    .form-field-flex label { display: block; font-size: 12px; font-weight: 700; color: #38bdf8; margin-bottom: 6px; text-transform: uppercase; }
    .input-console, .select-console {
      width: 100%; padding: 12px 16px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.12);
      background: #020617; color: #f8fafc; outline: none; font-size: 14px;
    }
    .btn-action-submit {
      background: linear-gradient(135deg, #06b6d4 0%, #10b981 100%); color: #021014; border: none;
      padding: 12px 24px; border-radius: 12px; font-weight: 800; font-size: 13px; cursor: pointer; white-space: nowrap;
    }
    .btn-action-cancel { background: transparent; color: #94a3b8; border: 1px solid rgba(255, 255, 255, 0.15); padding: 12px 20px; border-radius: 12px; font-weight: 700; font-size: 13px; cursor: pointer; }
    .console-table { width: 100%; border-collapse: separate; border-spacing: 0 8px; text-align: left; }
    .console-table th { color: #64748b; font-size: 12px; font-weight: 800; text-transform: uppercase; padding: 12px 20px; }
    .console-table tbody tr { background: rgba(30, 41, 59, 0.4); }
    .console-table td { padding: 16px 20px; color: #f1f5f9; font-size: 14px; }
    .tag-id { background: linear-gradient(135deg, rgba(139, 92, 246, 0.25), rgba(236, 72, 153, 0.25)); color: #e879f9; padding: 4px 12px; border-radius: 8px; font-family: monospace; font-size: 13px; font-weight: 700; }
    .tag-cat { background: rgba(6, 182, 212, 0.2); color: #38bdf8; padding: 4px 12px; border-radius: 8px; font-size: 13px; font-weight: 700; }
    .btn-icon-pill { padding: 6px 14px; font-size: 12px; font-weight: 700; border-radius: 10px; border: none; cursor: pointer; margin-right: 8px; }
    .btn-edit-pill { background: rgba(14, 165, 233, 0.2); color: #38bdf8; border: 1px solid rgba(14, 165, 233, 0.4); }
    .btn-delete-pill { background: rgba(239, 68, 68, 0.2); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.4); }
    .home-floating-btn {
      position: fixed; right: 24px; bottom: 24px; z-index: 2500; width: 56px; height: 56px; border-radius: 50%;
      background: linear-gradient(135deg, #ec4899 0%, #8b5cf6 100%); display: flex; align-items: center; justify-content: center; color: white; font-size: 22px; text-decoration: none;
    }
  </style>
<script>
window.API_BASE = window.API_BASE || (typeof process !== 'undefined' && process.env && process.env.NEXT_PUBLIC_API_URL) || 'http://localhost:3001';
(function() {
  var origFetch = window.fetch;
  window.fetch = function(input, init) {
    if (typeof input === 'string' && input.startsWith('/api/')) {
      input = window.API_BASE + input;
    } else if (typeof input === 'string' && input.startsWith('/uploads/')) {
      input = window.API_BASE + input;
    }
    return origFetch.call(this, input, init);
  };
})();
</script>
<script>
  if (!localStorage.getItem('currentUser')) window.location.replace('/login');
</script>
</head>
<body>
  <div class="workspace-inner">
    <div class="header-console">
      <div class="header-left-title">
        <h1>Services Management Console</h1>
        <p style="color:#94a3b8;">Configure essential service categories and provider directory</p>
      </div>
      <a href="/dashboard" class="btn-nav-back"><i class="fas fa-arrow-left"></i> Dashboard</a>
    </div>

    <div class="tabs-control-bar">
      <button class="tab-btn active" id="tabCategoriesBtn" onclick="switchTab('categories')">
        <i class="fas fa-folder-open"></i> Categories Management (<span id="catCountBadge">0</span>)
      </button>
      <button class="tab-btn" id="tabMembersBtn" onclick="switchTab('members')">
        <i class="fas fa-address-book"></i> Service Providers Directory (<span id="memCountBadge">0</span>)
      </button>
    </div>

    <!-- TAB 1: CATEGORIES -->
    <div className="console-panel" id="categoriesPanel">
      <div class="panel-header-toolbar">
        <div class="panel-title-text"><i class="fas fa-folder-plus" style="color: #06b6d4;"></i> Manage Service Categories</div>
        <span class="badge-count" id="catCountTag">0 Categories</span>
      </div>

      <div class="inline-form-panel">
        <form id="categoryForm">
          <input type="hidden" id="categoryId" />
          <div class="form-grid-row">
            <div class="form-field-flex">
              <label>Category ID</label>
              <input type="text" id="categoryInputId" class="input-console" required />
            </div>
            <div class="form-field-flex">
              <label>Category Name</label>
              <input type="text" id="categoryInputName" class="input-console" required />
            </div>
            <button type="submit" class="btn-action-submit"><i class="fas fa-save"></i> Save Category</button>
            <button type="button" id="categoryCancel" class="btn-action-cancel">Cancel</button>
          </div>
        </form>
      </div>

      <div style="overflow-x:auto;">
        <table id="categoriesTable" class="console-table">
          <thead>
            <tr><th>Category ID</th><th>Category Name</th><th style="text-align:center;">Actions</th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>

    <!-- TAB 2: MEMBERS -->
    <div class="console-panel" id="membersPanel" style="display:none;">
      <div class="panel-header-toolbar">
        <div class="panel-title-text"><i class="fas fa-user-shield" style="color: #a855f7;"></i> Manage Service Providers Directory</div>
        <span class="badge-count" id="memCountTag">0 Providers</span>
      </div>

      <div class="inline-form-panel">
        <form id="memberForm">
          <input type="hidden" id="memberId" />
          <div class="form-grid-row">
            <div class="form-field-flex">
              <label>Provider Name</label>
              <input type="text" id="memberName" class="input-console" required />
            </div>
            <div class="form-field-flex">
              <label>Phone Number</label>
              <input type="text" id="memberPhone" class="input-console" required />
            </div>
            <div class="form-field-flex">
              <label>Assigned Category</label>
              <select id="memberCategory" class="select-console" required></select>
            </div>
            <button type="submit" class="btn-action-submit"><i class="fas fa-user-check"></i> Save Provider</button>
            <button type="button" id="memberCancel" class="btn-action-cancel">Cancel</button>
          </div>
        </form>
      </div>

      <div style="overflow-x:auto;">
        <table id="membersTable" class="console-table">
          <thead>
            <tr><th>Provider Name</th><th>Phone Number</th><th>Category</th><th style="text-align:center;">Actions</th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>

  <a href="/" class="home-floating-btn" title="Go to Home"><i class="fas fa-home"></i></a>

  <script>
    function switchTab(tabName) {
      if (tabName === 'categories') {
        document.getElementById('categoriesPanel').style.display = 'block';
        document.getElementById('membersPanel').style.display = 'none';
        document.getElementById('tabCategoriesBtn').classList.add('active');
        document.getElementById('tabMembersBtn').classList.remove('active');
      } else {
        document.getElementById('categoriesPanel').style.display = 'none';
        document.getElementById('membersPanel').style.display = 'block';
        document.getElementById('tabCategoriesBtn').classList.remove('active');
        document.getElementById('tabMembersBtn').classList.add('active');
      }
    }

    const categoriesTableBody = document.querySelector('#categoriesTable tbody');
    const categoryForm = document.getElementById('categoryForm');
    const categoryIdInput = document.getElementById('categoryId');
    const categoryInputId = document.getElementById('categoryInputId');
    const categoryInputName = document.getElementById('categoryInputName');
    const categoryCancelBtn = document.getElementById('categoryCancel');

    const membersTableBody = document.querySelector('#membersTable tbody');
    const memberForm = document.getElementById('memberForm');
    const memberIdInput = document.getElementById('memberId');
    const memberNameInput = document.getElementById('memberName');
    const memberPhoneInput = document.getElementById('memberPhone');
    const memberCategorySelect = document.getElementById('memberCategory');
    const memberCancelBtn = document.getElementById('memberCancel');

    let categoryMap = new Map();

    function loadCategories() {
      return fetch('/api/categories')
        .then(res => res.json())
        .then(categories => {
          categoryMap.clear();
          categoriesTableBody.innerHTML = '';
          memberCategorySelect.innerHTML = '';
          document.getElementById('catCountBadge').textContent = categories.length;
          document.getElementById('catCountTag').textContent = `${categories.length} Categories`;

          categories.forEach(cat => {
            categoryMap.set(cat.id, cat.name);
            const tr = document.createElement('tr');
            tr.innerHTML = `
              <td><span class="tag-id">${cat.id}</span></td>
              <td style="font-weight:700;">${cat.name}</td>
              <td style="text-align:center;">
                <button class="btn-icon-pill btn-edit-pill" onclick="editCategory('${cat.id}')"><i class="fas fa-edit"></i> Edit</button>
                <button class="btn-icon-pill btn-delete-pill" onclick="deleteCategory('${cat.id}')"><i class="fas fa-trash"></i> Delete</button>
              </td>
            `;
            categoriesTableBody.appendChild(tr);

            const option = document.createElement('option');
            option.value = cat.id; option.textContent = cat.name;
            memberCategorySelect.appendChild(option);
          });
        });
    }

    function loadMembers() {
      fetch('/api/members')
        .then(res => res.json())
        .then(members => {
          membersTableBody.innerHTML = '';
          document.getElementById('memCountBadge').textContent = members.length;
          document.getElementById('memCountTag').textContent = `${members.length} Providers`;
          members.forEach(m => {
            const categoryName = categoryMap.get(m.category) || m.category;
            const tr = document.createElement('tr');
            tr.innerHTML = `
              <td style="font-weight:700;">${m.name}</td>
              <td style="font-family:monospace; font-weight:600;">${m.phone}</td>
              <td><span class="tag-cat">${categoryName}</span></td>
              <td style="text-align:center;">
                <button class="btn-icon-pill btn-edit-pill" onclick="editMember('${m.id}')"><i class="fas fa-edit"></i> Edit</button>
                <button class="btn-icon-pill btn-delete-pill" onclick="deleteMember('${m.id}')"><i class="fas fa-trash"></i> Delete</button>
              </td>
            `;
            membersTableBody.appendChild(tr);
          });
        });
    }

    categoryCancelBtn.onclick = () => { categoryIdInput.value = ''; categoryForm.reset(); };
    memberCancelBtn.onclick = () => { memberIdInput.value = ''; memberForm.reset(); };

    categoryForm.onsubmit = e => {
      e.preventDefault();
      const storedId = categoryIdInput.value;
      const id = categoryInputId.value.trim();
      const name = categoryInputName.value.trim();

      if (storedId) {
        fetch('/api/categories/' + storedId, { method: 'PUT', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ name }) })
          .then(() => { loadCategories(); categoryCancelBtn.click(); });
      } else {
        fetch('/api/categories', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ id, name }) })
          .then(res => { if (res.ok) { loadCategories(); categoryCancelBtn.click(); } else { res.json().then(data => alert(data.error || 'Failed')); } });
      }
    };

    memberForm.onsubmit = e => {
      e.preventDefault();
      const id = memberIdInput.value;
      const body = { name: memberNameInput.value.trim(), phone: memberPhoneInput.value.trim(), category: memberCategorySelect.value };
      if (id) {
        fetch('/api/members/' + id, { method: 'PUT', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body) })
          .then(() => { loadMembers(); memberForm.reset(); memberIdInput.value = ''; });
      } else {
        fetch('/api/members', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body) })
          .then(() => { loadMembers(); memberForm.reset(); });
      }
    };

    window.editCategory = id => {
      fetch('/api/categories').then(res => res.json()).then(cats => {
        const cat = cats.find(c => c.id === id);
        if (cat) { categoryIdInput.value = cat.id; categoryInputId.value = cat.id; categoryInputName.value = cat.name; }
      });
    };

    window.deleteCategory = id => {
      if (confirm('Delete this category?')) {
        fetch('/api/categories/' + id, { method: 'DELETE' }).then(() => { loadCategories(); loadMembers(); });
      }
    };

    window.editMember = id => {
      fetch('/api/members').then(res => res.json()).then(mems => {
        const m = mems.find(mem => mem.id === id);
        if (m) { memberIdInput.value = m.id; memberNameInput.value = m.name; memberPhoneInput.value = m.phone; memberCategorySelect.value = m.category; }
      });
    };

    window.deleteMember = id => {
      if (confirm('Delete this member?')) {
        fetch('/api/members/' + id, { method: 'DELETE' }).then(() => loadMembers());
      }
    };

    loadCategories().then(() => loadMembers());
  </script>
</body>
</html>
