<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Community Service Directory</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-midnight: #060913;
      --panel-navy: #0e1424;
      --accent-emerald: #10b981;
      --accent-cyan: #0284c7;
      --text-main: #f8fafc;
      --text-dim: #94a3b8;
    }
    * { box-sizing: border-box; }
    body {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      background: var(--bg-midnight);
      color: var(--text-main);
      margin: 0; padding: 36px 32px; min-height: 100vh;
    }
    .console-container-inner { max-width: 1200px; margin: 0 auto; }
    .console-nav-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 28px; }
    .btn-nav-home {
      display: inline-flex; align-items: center; gap: 10px;
      background: rgba(14, 20, 36, 0.9); border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-main); padding: 10px 20px; border-radius: 14px; font-size: 13px; font-weight: 700; text-decoration: none;
    }
    .hero-console-title h1 {
      font-size: 32px; font-weight: 800; margin: 0 0 8px 0;
      background: linear-gradient(135deg, #ffffff 0%, #34d399 50%, #38bdf8 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .hero-console-title p { color: var(--text-dim); font-size: 15px; margin: 0; }
    .category-capsule-bar { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 12px; margin-bottom: 28px; }
    .capsule-pill {
      display: inline-flex; align-items: center; gap: 8px; padding: 10px 20px;
      background: var(--panel-navy); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 30px;
      color: var(--text-dim); font-size: 13px; font-weight: 700; cursor: pointer; white-space: nowrap;
    }
    .capsule-pill.active { background: linear-gradient(135deg, #10b981 0%, #0284c7 100%); color: white; border-color: transparent; }
    .search-toolbar-row {
      display: flex; justify-content: space-between; align-items: center; background: var(--panel-navy);
      border: 1px solid rgba(255, 255, 255, 0.08); padding: 14px 20px; border-radius: 16px; margin-bottom: 24px; gap: 16px; flex-wrap: wrap;
    }
    .search-input-box {
      display: flex; align-items: center; gap: 10px; background: #060913; border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 8px 16px; border-radius: 12px; flex: 1; min-width: 240px;
    }
    .search-input-box input { background: transparent; border: none; outline: none; color: white; font-size: 14px; width: 100%; }
    .directory-strip-container {
      background: var(--panel-navy); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 20px; padding: 16px;
    }
    .directory-strip-item {
      display: flex; align-items: center; justify-content: space-between; padding: 16px 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }
    .directory-strip-item:last-child { border-bottom: none; }
    .provider-meta-left { display: flex; align-items: center; gap: 16px; }
    .provider-avatar-circle {
      width: 44px; height: 44px; border-radius: 50%;
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.2), rgba(2, 132, 199, 0.2));
      border: 1px solid var(--accent-emerald); display: flex; align-items: center; justify-content: center; color: #34d399; font-size: 18px; font-weight: 800;
    }
    .provider-name-details h3 { margin: 0 0 4px 0; font-size: 16px; font-weight: 800; color: white; }
    .badge-emerald-tag { background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); padding: 2px 8px; border-radius: 6px; font-size: 11px; font-weight: 700; }
    .badge-cyan-tag { background: rgba(2, 132, 199, 0.15); color: #38bdf8; border: 1px solid rgba(2, 132, 199, 0.3); padding: 2px 8px; border-radius: 6px; font-size: 11px; font-weight: 700; }
    .provider-actions-right { display: flex; align-items: center; gap: 16px; }
    .btn-call-emerald {
      display: inline-flex; align-items: center; gap: 8px; background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: white; padding: 8px 18px; border-radius: 12px; font-size: 13px; font-weight: 800; text-decoration: none;
    }
  </style>
<script>
window.API_BASE = window.API_BASE || (typeof process !== 'undefined' && process.env && process.env.NEXT_PUBLIC_API_URL) || 'http://localhost:3001';
(function() {
  var origFetch = window.fetch;
  window.fetch = function(input, init) {
    if (typeof input === 'string' && input.startsWith('/api/')) {
      input = window.API_BASE + input;
    } else if (typeof input === 'string' && input.startsWith('/uploads/')) {
      input = window.API_BASE + input;
    }
    return origFetch.call(this, input, init);
  };
})();
</script>
</head>
<body>
  <div class="console-container-inner">
    <div class="console-nav-row">
      <a href="/" class="btn-nav-home"><i class="fas fa-arrow-left"></i> Back to Home</a>
    </div>

    <div class="hero-console-title">
      <h1>Community Service Directory</h1>
      <p>Verified service professionals & emergency contacts in Sri Ambal Nagar</p>
    </div>

    <div id="categoryCapsuleBar" class="category-capsule-bar"></div>

    <div class="search-toolbar-row">
      <div class="search-input-box">
        <i class="fas fa-search"></i>
        <input type="text" id="searchInput" placeholder="Search provider by name or phone..." oninput="renderMembers()" />
      </div>
      <div id="resultsCount" style="font-size:13px; font-weight:700; color:#10b981;">Showing 0 Service Providers</div>
    </div>

    <div id="directoryStripContainer" class="directory-strip-container"></div>
  </div>

  <script>
    let allCategories = [];
    let allMembers = [];
    let selectedCatId = 'all';

    function loadData() {
      fetch('/api/categories')
        .then(res => res.json())
        .then(cats => {
          allCategories = cats;
          renderCapsules();
          return fetch('/api/members');
        })
        .then(res => res.json())
        .then(mems => {
          allMembers = mems;
          renderCapsules();
          renderMembers();
        });
    }

    function renderCapsules() {
      const container = document.getElementById('categoryCapsuleBar');
      container.innerHTML = `
        <button class="capsule-pill ${selectedCatId === 'all' ? 'active' : ''}" onclick="selectCat('all')">
          <i class="fas fa-th-large"></i> All Categories (${allMembers.length})
        </button>
      `;

      allCategories.forEach(cat => {
        const count = allMembers.filter(m => m.category === cat.id).length;
        container.innerHTML += `
          <button class="capsule-pill ${selectedCatId === cat.id ? 'active' : ''}" onclick="selectCat('${cat.id}')">
            <i class="fas fa-tools"></i> ${cat.name} (${count})
          </button>
        `;
      });
    }

    function selectCat(catId) {
      selectedCatId = catId;
      renderCapsules();
      renderMembers();
    }

    function renderMembers() {
      const search = document.getElementById('searchInput').value.toLowerCase();
      const container = document.getElementById('directoryStripContainer');
      const filtered = allMembers.filter(m => {
        const matchCat = selectedCatId === 'all' || m.category === selectedCatId;
        const matchSearch = m.name.toLowerCase().includes(search) || m.phone.includes(search);
        return matchCat && matchSearch;
      });

      document.getElementById('resultsCount').textContent = `Showing ${filtered.length} Service Providers`;
      container.innerHTML = '';

      if (filtered.length === 0) {
        container.innerHTML = `<div style="text-align:center; padding:40px; color:#94a3b8; font-weight:600;">No service providers found.</div>`;
        return;
      }

      filtered.forEach(m => {
        const catObj = allCategories.find(c => c.id === m.category);
        const catName = catObj ? catObj.name : m.category;
        const initial = m.name ? m.name.charAt(0).toUpperCase() : 'P';

        container.innerHTML += `
          <div class="directory-strip-item">
            <div class="provider-meta-left">
              <div class="provider-avatar-circle">${initial}</div>
              <div class="provider-name-details">
                <h3>${m.name}</h3>
                <div style="display:flex; gap:8px;">
                  <span class="badge-cyan-tag">${catName}</span>
                  <span class="badge-emerald-tag"><i class="fas fa-check-circle"></i> Verified</span>
                </div>
              </div>
            </div>
            <div class="provider-actions-right">
              <span style="font-family:monospace; font-size:15px; font-weight:700; color:#cbd5e1;">${m.phone}</span>
              <a href="tel:${m.phone}" class="btn-call-emerald"><i class="fas fa-phone-alt"></i> Call Direct</a>
            </div>
          </div>
        `;
      });
    }

    loadData();
  </script>
</body>
</html>
